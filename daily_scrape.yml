name: Daily Tender Auto Scraper

on:
  schedule:
    # Daily Subah 5:30 AM (IST) par automatic chalega
    - cron: '0 0 * * *'
  workflow_dispatch: # Manual chalaney ke liye option

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/python-version@v4
      with:
        python-version: '3.x'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Scraper
      run: python scraper.py

    - name: Commit and Push Updated Tenders JSON
      run: |
        git config --global user.name 'Tender Bot'
        git config --global user.email 'bot@tendergalaxy.com'
        git add tenders.json
        git commit -m "Auto-updated tenders data" || exit 0
        git push